name: Release

# Every push to main whose COLLECTOR_VERSION has no release yet becomes release
# v<version>: zip and checksum.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$(python3 -c 'import faf_settings; print(faf_settings.COLLECTOR_VERSION)')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released"; echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Zip, checksum, release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          NAME="faf-collector-$TAG"
          git archive --format=zip --prefix="faf/" -o "$NAME.zip" HEAD -- . ':!.github'
          sha256sum "$NAME.zip" > "$NAME.zip.sha256"
          cat "$NAME.zip.sha256"
          gh release create "$TAG" "$NAME.zip" "$NAME.zip.sha256" --target "$GITHUB_SHA" \
            --title "$TAG" --notes "Install: see README.md. Verify the zip with the .sha256 file."
