name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]  # ubuntu-latest (26.04) has no Python 3.9
        python: ['3.9', '3.13']
        include: [{ os: macos-latest, python: '3.9' }]  # the macOS system Python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: '${{ matrix.python }}' }
      - run: python -m unittest discover -s tests -p "test_*.py"
